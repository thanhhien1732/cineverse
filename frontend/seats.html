<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Chọn ghế ngồi tại CINEVERSE.">
  <title>Chọn ghế | CINEVERSE</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div data-site-header></div>
  <main class="booking-page">
    <section class="booking-top">
      <div class="container">
        <div data-booking-steps></div>
      </div>
    </section>
    <div class="container booking-layout">
      <div class="booking-content">
        <div class="seat-context" data-seat-context></div>
        <section class="seat-map-shell" data-seat-map></section>
        <div class="seat-legend" aria-label="Chú thích ghế">
          <span><i></i> Thường</span>
          <span><i class="legend-vip"></i> VIP</span>
          <span><i class="legend-couple"></i> Couple</span>
          <span><i class="legend-selected"></i> Đang chọn</span>
          <span><i class="legend-reserved"></i> Đã đặt</span>
        </div>
      </div>
      <aside class="summary-panel" data-seat-summary></aside>
    </div>
  </main>
  <div data-site-footer></div>
  <script src="js/sync-bootstrap.js"></script>
  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/seats.js"></script>
</body>
</html>
