<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Chọn phim, rạp, ngày và suất chiếu tại CINEVERSE." />
    <title>Chọn suất chiếu | CINEVERSE</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div data-site-header></div>
    <main class="booking-page">
      <section class="booking-top">
        <div class="container">
          <p class="eyebrow">ĐẶT VÉ CINEVERSE</p>
          <h1>Chọn suất chiếu</h1>
          <p>Chọn phim, ngày chiếu và rạp phù hợp với lịch trình của bạn.</p>
          <div data-booking-steps></div>
        </div>
      </section>
      <div class="container booking-layout">
        <div class="booking-content">
          <section class="booking-panel">
            <div class="booking-panel-head">
              <h2>01. Chọn phim</h2>
              <span>Phim đang mở bán vé</span>
            </div>

            <div class="picker-movies" data-movie-picker></div>

            <div
              class="showtime-age-block"
              data-age-restriction-banner
              role="status"
              aria-live="polite"
              hidden></div>
          </section>

          <section class="booking-panel" data-date-panel>
            <div class="booking-panel-head">
              <h2>02. Chọn ngày</h2>
              <span>7 ngày gần nhất</span>
            </div>

            <div class="date-picker" data-date-picker></div>
          </section>

          <section class="booking-panel" data-cinema-panel>
            <div class="booking-panel-head">
              <h2>03. Chọn rạp và suất</h2>
              <span>TP. Hồ Chí Minh</span>
            </div>

            <div class="cinema-list" data-cinema-list></div>
          </section>
        </div>
        <aside class="summary-panel" data-showtime-summary></aside>
      </div>
    </main>
    <div data-site-footer></div>
    <script src="js/sync-bootstrap.js"></script>
    <script src="js/data.js"></script>
    <script src="js/core.js"></script>
    <script src="js/showtime-age-restriction.js"></script>
    <script src="js/showtimes.js"></script>
  </body>
</html>
