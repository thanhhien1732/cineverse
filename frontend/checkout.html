<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Xác nhận đơn hàng và thanh toán vé xem phim CINEVERSE.">
  <title>Thanh toán | CINEVERSE</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div data-site-header></div>
  <main class="booking-page">
    <section class="booking-top">
      <div class="container">
        <p class="eyebrow">SECURE CHECKOUT</p>
        <h1>Xác nhận đặt vé</h1>
        <p>Kiểm tra thông tin đơn hàng và hoàn tất thanh toán.</p>
        <div data-booking-steps></div>
      </div>
    </section>
    <div class="container checkout-grid">
      <form class="checkout-form-card" data-checkout-form novalidate>
        <section class="form-section" data-checkout-account></section>
        <section class="form-section rewards-section" data-checkout-rewards></section>
        <section class="form-section age-verification-section" data-age-verification></section>

        <section class="form-section">
          <h2>Phương thức thanh toán</h2>
          <br>
          <div class="payment-options">
            <label class="payment-option"><input type="radio" name="paymentMethod" value="card" checked><span><strong>Thẻ ngân hàng</strong><small>Visa, Mastercard và thẻ nội địa</small></span></label>
            <label class="payment-option"><input type="radio" name="paymentMethod" value="momo"><span><strong>Ví MoMo</strong><small>Quét QR hoặc xác nhận giao dịch trong ứng dụng MoMo</small></span></label>
          </div>
          <div class="payment-panel" data-payment-panel></div>
        </section>
        <label class="terms-check age-confirm-check"><input type="checkbox" name="ageConfirm" required><span>Tôi xác nhận thông tin cá nhân và điều kiện phân loại độ tuổi của đơn hàng là chính xác.</span></label>
        <label class="terms-check"><input type="checkbox" name="terms" required><span>Tôi đồng ý với Điều khoản sử dụng, Chính sách bảo mật và chính sách kiểm soát vé của CINEVERSE.</span></label>
        <button class="btn btn-primary btn-block" type="submit" data-pay-button>Xác nhận thanh toán và nhận vé</button>
      </form>
      <aside class="summary-panel" data-checkout-summary></aside>
    </div>
  </main>
  <div data-site-footer></div>
  <script src="js/sync-bootstrap.js"></script>
  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
